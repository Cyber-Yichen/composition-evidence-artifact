# Model roster. Confirm remote model availability before running an evaluation.
# API keys are read from environment variables only — never from files.

local:
  qwen2_5_vl_7b:
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    backend: qwen_vl
    dtype: bfloat16
    role: primary
  internvl3_8b:
    hf_id: OpenGVLab/InternVL3-8B-hf   # transformers-native release (AutoModelForImageTextToText)
    backend: generic_hf
    dtype: bfloat16
    role: secondary
  llava_onevision_7b:
    hf_id: llava-hf/llava-onevision-qwen2-7b-ov-hf
    backend: generic_hf
    dtype: bfloat16
    role: secondary          # swap for another ~7B model if it does not fit in 24GB
  shotvl_7b:
    hf_id: Vchitect/ShotVL-7B
    backend: qwen_vl            # ShotVL is Qwen2.5-VL based
    dtype: bfloat16
    role: specialist_control
    # ShotVL only answers reliably in its trained <think>/<answer> format with the
    # official reasoning system prompt and a 1024-token budget (42-48% parse
    # failures otherwise — corroborates RefineShot's instruction-following critique)
    reasoning: true

# Commercial models use their official provider APIs. The provider field is
# intentionally explicit: arbitrary third-party base URLs are not accepted.
# Model aliases should be checked against each provider's model list before reruns.
api:
  qwen_vl_max:
    provider: alibaba_model_studio
    model: qwen-vl-max
    base_url_env: DASHSCOPE_BASE_URL
    api_key_env: DASHSCOPE_API_KEY
    evaluation_month: 2026-07
    conditions: [C0, C2]
  qwen3_vl_plus:
    provider: alibaba_model_studio
    model: qwen3-vl-plus
    base_url_env: DASHSCOPE_BASE_URL
    api_key_env: DASHSCOPE_API_KEY
    evaluation_month: 2026-07
    conditions: [C0, C2]
  gpt_5_4:
    provider: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    evaluation_month: 2026-07
    max_tokens: 600
    conditions: [C0, C2]
  gemini_3_1_pro:
    provider: google
    model: gemini-3.1-pro
    api_key_env: GEMINI_API_KEY
    evaluation_month: 2026-07
    max_tokens: 600
    conditions: [C0, C2]
  claude_opus_4_8:
    provider: anthropic
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    evaluation_month: 2026-07
    max_tokens: 600
    conditions: [C0, C2]
